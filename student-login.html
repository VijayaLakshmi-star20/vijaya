<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="center-page">
      <section class="card form-card">
        <h1>Student Login</h1>
        <p class="subtext">Demo credentials: Register No `123`, Password `123`</p>
        <form id="studentLoginForm" class="form-grid">
          <label for="studentRegNo">Register Number</label>
          <input id="studentRegNo" type="text" placeholder="Enter register number" required />

          <label for="studentPassword">Password</label>
          <input id="studentPassword" type="password" placeholder="Enter password" required />

          <button class="btn btn-primary" type="submit">Login</button>
          <p id="studentLoginMessage" class="message"></p>
        </form>
        <a class="text-link" href="student-signup.html">New student? Create account</a>
        <a class="text-link" href="index.html">Back to Home</a>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
