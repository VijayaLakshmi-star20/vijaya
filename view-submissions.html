<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Submissions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="page-wrap">
      <header class="page-header">
        <h1>View Submissions</h1>
        <a class="btn btn-outline" href="faculty-dashboard.html">Back to Dashboard</a>
      </header>
      <section>
        <div class="stats-grid compact-grid">
          <article class="card stat-card">
            <h3>Total</h3>
            <p id="viewTotalSubmissions" class="stat-value">0</p>
          </article>
          <article class="card stat-card">
            <h3>Reviewed</h3>
            <p id="viewReviewedCount" class="stat-value">0</p>
          </article>
          <article class="card stat-card">
            <h3>Late</h3>
            <p id="viewLateCount" class="stat-value">0</p>
          </article>
          <article class="card stat-card">
            <h3>Average Score</h3>
            <p id="viewAverageScore" class="stat-value">0</p>
          </article>
        </div>

        <div class="toolbar card">
          <input id="submissionSearchInput" type="text" placeholder="Search by student, reg no, assignment" />
          <select id="submissionStatusFilter">
            <option value="all">All Reviews</option>
            <option value="pending">Pending Review</option>
            <option value="reviewed">Reviewed</option>
          </select>
          <select id="submissionLateFilter">
            <option value="all">On-Time + Late</option>
            <option value="onTime">On-Time Only</option>
            <option value="late">Late Only</option>
          </select>
          <select id="submissionAssignmentFilter">
            <option value="all">All Assignments</option>
          </select>
          <select id="submissionSortFilter">
            <option value="submittedDesc">Newest Submission</option>
            <option value="submittedAsc">Oldest Submission</option>
            <option value="scoreDesc">Score High-Low</option>
            <option value="scoreAsc">Score Low-High</option>
          </select>
          <button id="exportSubmissionsCsv" class="btn btn-secondary" type="button">Export CSV</button>
        </div>
        <div id="submissionList" class="cards-grid"></div>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
