<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Assignment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="center-page">
      <section class="card form-card">
        <h1>Upload Assignment</h1>
        <form id="uploadForm" class="form-grid">
          <label for="assignmentTitle">Assignment Name</label>
          <select id="assignmentTitle" required></select>

          <div id="selectedAssignmentMeta" class="info-panel"></div>

          <label for="assignmentFile">Upload File</label>
          <input id="assignmentFile" type="file" required />

          <label for="uploadHours">Hours Spent</label>
          <input id="uploadHours" type="number" min="0" step="0.5" placeholder="Ex: 3.5" />

          <label for="uploadNote">Submission Note</label>
          <textarea id="uploadNote" rows="3" placeholder="Any context for faculty review"></textarea>

          <label class="checkbox-label" for="ownWorkDeclaration">
            <input id="ownWorkDeclaration" type="checkbox" />
            I confirm this is my own work.
          </label>

          <button class="btn btn-primary" type="submit">Submit Assignment</button>
          <p id="uploadMessage" class="message"></p>
        </form>
        <a class="text-link" href="student-dashboard.html">Back to Dashboard</a>
      </section>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
